name: Build and deploy

on:
  push:
    branches: [main]
  # Every 15 minutes: refresh GitHub data and rebuild only if it changed, so new
  # commits in any repository show up in the figures and the regression table.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Uses only Node built-ins, so it runs before npm ci and keeps no-change runs short.
      - name: Refresh GitHub data
        id: data
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-github.mjs
          NEW=$(cat public/data-version.txt 2>/dev/null || echo "fetch-failed")
          LIVE=$(curl -fsS https://ofurkan.co/data-version.txt 2>/dev/null || echo "none")
          echo "data version: new=$NEW live=$LIVE"
          CHANGED=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # On a schedule, skip when nothing changed or the API call failed,
            # so a failed fetch never replaces live data with the stale committed copy.
            if [ "$NEW" = "$LIVE" ] || [ "$NEW" = "fetch-failed" ]; then CHANGED=false; fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Rebuild needed: $CHANGED"

      - if: steps.data.outputs.changed == 'true'
        run: npm ci

      - if: steps.data.outputs.changed == 'true'
        run: npx astro build

      - name: Sync to VPS
        if: steps.data.outputs.changed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to rrsync on the server, so "/" is the site root.
          rsync -rlptz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "deploy@${HOST}:/"
